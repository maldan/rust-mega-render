[package]
name = "mega-render"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30"
glam = "0.33.2"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
gltf = { version = "1.4", features = ["import", "utils"] }

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
winit = "0.30"

[[example]]
name = "demo"
path = "examples/demo.rs"
