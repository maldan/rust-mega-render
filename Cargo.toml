[package]
name = "mega-render"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30"
glam = "0.33.2"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg", "exr", "hdr"] }
half = "2"
gltf = { version = "1.4", features = ["import", "utils"] }

# Optional VR support (see src/xr). Off by default — pulls in no extra deps
# unless the `xr` feature is enabled.
openxr = { version = "0.21", default-features = false, features = ["loaded"], optional = true }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

[features]
default = []
# OpenXR/VR support. Forces a dedicated Vulkan instance+device for the XR
# session (interop requirement); the desktop wgpu path is unaffected.
xr = ["dep:openxr", "dep:ash"]

[dev-dependencies]
arboard = "3"
ctrlc = "3"
env_logger = "0.11"
log = "0.4"
# Demo-only UI. Path dep keeps mega-render ↔ mega-ui free of cycles
# (mega-ui does not depend on mega-render).
mega-ui = { path = "../ui", features = ["wgpu"] }
# Jiggle-bone ("soft chain") physics for the xr_scene example only — same
# reasoning as mega-ui above, keeps the core lib physics-free.
mega-physics = { path = "../physics" }
pollster = "0.4"
winit = "0.30"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "hud_demo"
path = "examples/hud_demo.rs"

[[example]]
name = "debug_draw"
path = "examples/debug_draw.rs"

[[example]]
name = "xr_hello"
path = "examples/xr_hello.rs"
required-features = ["xr"]

[[example]]
name = "xr_scene"
path = "examples/xr_scene.rs"
required-features = ["xr"]
